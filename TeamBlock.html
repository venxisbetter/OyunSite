<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Blast - Global Online Leaderboard</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #090a12;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        html { height: -webkit-fill-available; }

        /* Giriş Menüsü */
        #start-menu {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #090a12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.25s ease, visibility 0.25s;
            padding: 20px;
        }

        #menu-title {
            font-size: clamp(32px, 8vw, 46px);
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        #menu-subtitle {
            font-size: 14px;
            color: #5f6683;
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            max-width: 280px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: #ffbe0b;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #player-name-input {
            width: 100%;
            padding: 14px;
            background: #111322;
            border: 2px solid #222640;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        #player-name-input:focus { border-color: #ffbe0b; }

        /* Oyun Konteyneri */
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #111322;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid #1a1d33;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.3s ease-out;
            position: relative;
            width: 95vw;
            max-width: 410px;
            max-height: 92vh;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        #title { 
            font-size: clamp(16px, 4.5vw, 22px); 
            font-weight: 900; 
            letter-spacing: 1px; 
            color: #ffffff;
        }
        
        #score-box {
            font-family: "Arial Black", "Impact", sans-serif;
            font-size: clamp(12px, 3.5vw, 18px); 
            font-weight: 900; 
            font-style: italic;
            color: #ffffff; 
            background: #090a12; 
            padding: 6px 14px; 
            border-radius: 12px; 
            border: 2px solid #222640;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #score { color: #ffbe0b; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); }
        .pulse { transform: scale(1.15); border-color: #ffbe0b !important; }

        /* Canvas Alanı */
        .canvas-area {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 380px;
            max-height: 380px;
        }

        canvas {
            background-color: transparent;
            border-radius: 12px;
            border: 1px solid #1a1d33;
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
        }

        #screen-combo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-family: "Arial Black", "Impact", sans-serif;
            font-size: clamp(24px, 7vw, 38px);
            font-weight: 900;
            font-style: italic;
            color: #ff007f;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            white-space: nowrap;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.3), opacity 0.15s ease;
        }
        
        #screen-combo.pop { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
        #screen-combo.fade { opacity: 0; transform: translate(-50%, -50%) scale(1.25); transition: transform 0.8s ease-out, opacity 0.8s ease-out; }

        /* Blok Yuvaları */
        #piece-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            height: clamp(80px, 18vh, 110px);
            margin-top: 15px;
            background: #090a12;
            border-radius: 12px;
            padding: 8px;
            border: 1px solid #1a1d33;
        }

        .piece-slot {
            width: 30%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            border-radius: 8px; cursor: grab;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .mini-grid { display: grid; gap: 2px; pointer-events: none; }
        .mini-cell { border-radius: 3px; position: relative; box-sizing: border-box; }
        .empty { background-color: transparent !important; border: none !important; box-shadow: none !important; }

        /* Renkler */
        .color-1 { background: #ee5253; border: 2px solid; border-color: #ff6b6b #b33939 #b33939 #ff6b6b; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .color-2 { background: #0abde3; border: 2px solid; border-color: #48dbfb #01a3a4 #01a3a4 #48dbfb; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .color-3 { background: #10ac84; border: 2px solid; border-color: #1dd1a1 #0d8a69 #0d8a69 #1dd1a1; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .color-4 { background: #ff9f43; border: 2px solid; border-color: #feca57 #d35400 #d35400 #feca57; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .color-5 { background: #f368e0; border: 2px solid; border-color: #ff9ff3 #833471 #833471 #ff9ff3; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .color-6 { background: #00a8ff; border: 2px solid; border-color: #00eaff #0062cc #0062cc #00eaff; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }

        #drag-overlay {
            position: fixed; pointer-events: none; display: none; z-index: 100;
            transform: translate(-50%, -50%) scale(1.05);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        /* Dünya Skor Sıralaması Alanı */
        #game-over {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(9, 10, 18, 0.98); flex-direction: column;
            justify-content: center; align-items: center; z-index: 30; padding: 20px;
        }

        #game-over h1 { font-size: 32px; color: #ff6b6b; margin-bottom: 5px; font-weight: 900; }
        #game-over p { font-size: 18px; margin-bottom: 20px; color: #a4b0be; }

        .leaderboard-box {
            width: 100%; max-width: 300px;
            background: #111322; border: 1px solid #222640;
            border-radius: 12px; padding: 15px; margin-bottom: 30px;
        }

        .leaderboard-title {
            font-size: 13px; font-weight: 800; color: #ffbe0b;
            text-align: center; margin-bottom: 12px; letter-spacing: 1px;
            text-transform: uppercase; border-bottom: 1px solid #222640; padding-bottom: 6px;
        }

        .leaderboard-row {
            display: flex; justify-content: space-between;
            padding: 8px 4px; font-size: 15px; border-bottom: 1px dashed #1c1f36;
        }
        .leaderboard-row:last-child { border-bottom: none; }
        .leaderboard-row .rank { color: #5f6683; font-weight: bold; margin-right: 8px; }
        .leaderboard-row .name { flex-grow: 1; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .leaderboard-row .score-val { color: #ffbe0b; font-weight: bold; }
        .leaderboard-row.current-player { background: rgba(255, 190, 11, 0.15); border-radius: 6px; padding: 8px; }

        .btn { 
            padding: 14px 40px; font-size: 16px; font-weight: 700; color: #090a12; 
            background: #ffffff; border: none; border-radius: 8px; cursor: pointer; 
            transition: background 0.2s, transform 0.1s; 
        }
        .btn:hover { background: #e5e5e5; transform: translateY(-1px); }
    </style>
</head>
<body>

    <div id="start-menu">
        <div id="menu-title">BLOCK BLAST</div>
        <div id="menu-subtitle">🌍 CANLI ONLİNE SKOR TABLOSU</div>
        
        <div class="input-group">
            <label for="player-name-input">İsmini Yaz (Online Tabloda Görünecek):</label>
            <input type="text" id="player-name-input" maxlength="12" placeholder="Umut" autocomplete="off">
        </div>

        <button class="btn" onclick="startGameFromMenu()">Oyunu Başlat</button>
    </div>

    <div id="game-container">
        <div id="header">
            <div id="title">BLOCK BLAST</div>
            <div id="score-box">SCORE: <span id="score">0</span></div>
        </div>
        
        <div class="canvas-area">
            <canvas id="gameCanvas" width="388" height="388"></canvas>
            <div id="screen-combo">KOMBO X2!</div>
        </div>

        <div id="piece-container">
            <div class="piece-slot" id="slot-0"></div>
            <div class="piece-slot" id="slot-1"></div>
            <div class="piece-slot" id="slot-2"></div>
        </div>
    </div>

    <div id="drag-overlay"></div>

    <div id="game-over">
        <h1>Oyun Bitti</h1>
        <p>Skorunuz: <span id="final-score" style="color:#ffbe0b; font-weight:bold;">0</span></p>
        
        <div class="leaderboard-box">
            <div class="leaderboard-title">🌐 KÜRESEL EN İYİ 5 (CANLI)</div>
            <div id="leaderboard-list">
                <div style="text-align:center; color:#5f6683; padding:10px;">Skorlar yükleniyor...</div>
            </div>
        </div>

        <button class="btn" onclick="restartGame()">Tekrar Dene</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Yapılandırması (Kendi bilgilerinle doldurabilirsin)
        const firebaseConfig = {
            apiKey: "BURAYA_KENDİ_API_KEYİNİ_YAPISTIR",
            authDomain: "PROJE_ID.firebaseapp.com",
            projectId: "PROJE_ID",
            storageBucket: "PROJE_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveOnlineScore = async function(name, finalScore) {
            try {
                await addDoc(collection(db, "leaderboard"), {
                    name: name,
                    score: finalScore,
                    timestamp: Date.now()
                });
                await window.fetchOnlineLeaderboard(name, finalScore);
            } catch (e) {
                console.error("Skor yüklenirken hata oluştu: ", e);
            }
        }

        window.fetchOnlineLeaderboard = async function(currentPlayerName, currentScore) {
            const listContainer = document.getElementById('leaderboard-list');
            try {
                const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(5));
                const querySnapshot = await getDocs(q);
                listContainer.innerHTML = '';
                
                let index = 1;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const row = document.createElement('div');
                    row.classList.add('leaderboard-row');
                    
                    if (data.name === currentPlayerName && data.score === currentScore) {
                        row.classList.add('current-player');
                    }
                    
                    row.innerHTML = `
                        <span class="rank">#${index}</span>
                        <span class="name">${data.name}</span>
                        <span class="score-val">${data.score}</span>
                    `;
                    listContainer.appendChild(row);
                    index++;
                });
            } catch(e) {
                listContainer.innerHTML = '<div style="text-align:center; color:#ff6b6b;">Hata oluştu!</div>';
            }
        }
    </script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dragOverlay = document.getElementById('drag-overlay');
        const screenCombo = document.getElementById('screen-combo');

        const GRID_SIZE = 8;
        const CELL_SIZE = 45;
        const GAP = 4;
        const PADDING = 8;
        const DRAG_Y_OFFSET = 75; 

        let gridData = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        let score = 0;
        let comboCount = 0; 
        let comboTimeoutId = null; 
        let activePieces = [null, null, null];
        let selectedPieceIndex = null;
        let isDragging = false;
        let particles = [];
        let mouseX = -100, mouseY = -100;
        let playerName = "Umut";

        document.addEventListener('touchmove', function(e) { if (isDragging) e.preventDefault(); }, { passive: false });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            if (type === 'select') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.02);
                gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.02);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.02);
            } else if (type === 'place') {
                const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc1.type = 'triangle'; osc1.frequency.setValueAtTime(150, now); osc1.frequency.linearRampToValueAtTime(60, now + 0.07);
                osc2.type = 'sine'; osc2.frequency.setValueAtTime(90, now); osc2.frequency.linearRampToValueAtTime(40, now + 0.07);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
                osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination); osc1.start(now); osc2.start(now); osc1.stop(now + 0.08); osc2.stop(now + 0.08);
            } else if (type === 'blast') {
                const bufferSize = audioCtx.sampleRate * 0.25; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(400 + (comboCount * 80), now); filter.frequency.exponentialRampToValueAtTime(10, now + 0.24);
                const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(now); noise.stop(now + 0.25);
            } else if (type === 'gameover') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now); osc.frequency.linearRampToValueAtTime(40, now + 0.5);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.5);
            }
        }

        const TEXTURE_COLORS = {
            0: { base: '#0e0f1a' },
            1: { base: '#ee5253', light: '#ff6b6b', dark: '#b33939' },
            2: { base: '#0abde3', light: '#48dbfb', dark: '#01a3a4' },
            3: { base: '#10ac84', light: '#1dd1a1', dark: '#0d8a69' },
            4: { base: '#ff9f43', light: '#feca57', dark: '#d35400' },
            5: { base: '#f368e0', light: '#ff9ff3', dark: '#833471' },
            6: { base: '#00a8ff', light: '#00eaff', dark: '#0062cc' }
        };

        const PIECE_SHAPES = [
            { shape: [[1]], color: 1 }, { shape: [[1, 1]], color: 2 }, { shape: [[1], [1]], color: 2 }, 
            { shape: [[1, 1, 1]], color: 3 }, { shape: [[1], [1], [1]], color: 3 }, { shape: [[1, 1], [1, 1]], color: 4 }, 
            { shape: [[1, 1, 1], [0, 1, 0]], color: 5 }, { shape: [[1, 0], [1, 0], [1, 1]], color: 6 }, { shape: [[1, 1], [1, 0], [1, 0]], color: 1 }  
        ];

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color; this.size = Math.random() * 3 + 2;
                this.speedX = (Math.random() - 0.5) * 6; this.speedY = (Math.random() - 0.5) * 6;
                this.alpha = 1; this.decay = Math.random() * 0.03 + 0.02;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.alpha -= this.decay; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.restore(); }
        }

        function createExplosion(pixelX, pixelY, color) {
            for (let i = 0; i < 8; i++) particles.push(new Particle(pixelX + CELL_SIZE/2, pixelY + CELL_SIZE/2, color));
        }

        function getCellCoords(row, col) { return { x: PADDING + col * (CELL_SIZE + GAP), y: PADDING + row * (CELL_SIZE + GAP) }; }

        function drawTexturedBlock(x, y, size, colorIndex, alpha = 1) {
            const colors = TEXTURE_COLORS[colorIndex]; if (!colors) return;
            ctx.save(); ctx.globalAlpha = alpha;
            if (colorIndex === 0) {
                ctx.fillStyle = colors.base; ctx.fillRect(x, y, size, size); ctx.strokeStyle = '#141627'; ctx.lineWidth = 1; ctx.strokeRect(x, y, size, size); ctx.restore(); return;
            }
            const b = size * 0.14; ctx.fillStyle = colors.base; ctx.fillRect(x, y, size, size);
            ctx.fillStyle = colors.light; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + size, y); ctx.lineTo(x + size - b, y + b); ctx.lineTo(x + b, y + b); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + b, y + b); ctx.lineTo(x + b, y + size - b); ctx.lineTo(x, y + size); ctx.fill();
            ctx.fillStyle = colors.dark; ctx.beginPath(); ctx.moveTo(x, y + size); ctx.lineTo(x + b, y + size - b); ctx.lineTo(x + size - b, y + size - b); ctx.lineTo(x + size, y + size); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x + size, y); ctx.lineTo(x + size, y + size); ctx.lineTo(x + size - b, y + size - b); ctx.lineTo(x + size - b, y + b); ctx.fill();
            ctx.restore();
        }

        function getGridPosFromOverlay(clientX, clientY) {
            if (selectedPieceIndex === null) return null;
            const currentPiece = activePieces[selectedPieceIndex]; const rect = canvas.getBoundingClientRect(); const visualCellSize = rect.width / GRID_SIZE;
            const pieceWidthPixels = currentPiece.shape[0].length * visualCellSize; const pieceHeightPixels = currentPiece.shape.length * visualCellSize;
            const targetX = clientX - rect.left - (pieceWidthPixels / 2) + (visualCellSize / 2); const targetY = (clientY - DRAG_Y_OFFSET) - rect.top - (pieceHeightPixels / 2) + (visualCellSize / 2);
            const col = Math.round(targetX / visualCellSize); const row = Math.round(targetY / visualCellSize);
            if (canPlacePiece(currentPiece.shape, row, col)) return { row, col };
            const searchOffsets = [{r:0,c:-1},{r:0,c:1},{r:-1,c:0},{r:1,c:0},{r:-1,c:-1},{r:-1,c:1},{r:1,c:-1},{r:1,c:1}];
            for (let offset of searchOffsets) {
                const checkRow = row + offset.r; const checkCol = col + offset.c; if (canPlacePiece(currentPiece.shape, checkRow, checkCol)) return { row: checkRow, col: checkCol };
            }
            return { row, col };
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); const gridPos = getGridPosFromOverlay(mouseX, mouseY);
            for (let r = 0; r < GRID_SIZE; r++) { for (let c = 0; c < GRID_SIZE; c++) { const { x, y } = getCellCoords(r, c); drawTexturedBlock(x, y, CELL_SIZE, gridData[r][c]); } }
            if (isDragging && selectedPieceIndex !== null && gridPos) {
                const currentPiece = activePieces[selectedPieceIndex];
                if (canPlacePiece(currentPiece.shape, gridPos.row, gridPos.col)) {
                    for (let r = 0; r < currentPiece.shape.length; r++) {
                        for (let c = 0; c < currentPiece.shape[r].length; c++) {
                            if (currentPiece.shape[r][c] === 1) { const previewCoords = getCellCoords(gridPos.row + r, gridPos.col + c); drawTexturedBlock(previewCoords.x, previewCoords.y, CELL_SIZE, currentPiece.color, 0.35); }
                        }
                    }
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); particles[i].draw(); if (particles[i].alpha <= 0) particles.splice(i, 1); }
            requestAnimationFrame(drawGame);
        }

        function startGameFromMenu() {
            const inputVal = document.getElementById('player-name-input').value.trim(); playerName = inputVal !== "" ? inputVal : "Umut";
            playSound('select'); const menu = document.getElementById('start-menu'); menu.style.opacity = '0'; setTimeout(() => { menu.style.visibility = 'hidden'; }, 250);
            const container = document.getElementById('game-container'); container.style.opacity = '1'; container.style.transform = 'scale(1)';
            spawnPieces(); drawGame();
        }

        function spawnPieces() {
            for (let i = 0; i < 3; i++) { const randomPiece = PIECE_SHAPES[Math.floor(Math.random() * PIECE_SHAPES.length)]; activePieces[i] = JSON.parse(JSON.stringify(randomPiece)); renderPieceInSlot(activePieces[i], i); }
        }

        function renderPieceInSlot(piece, slotIndex) {
            const slot = document.getElementById(`slot-${slotIndex}`); slot.innerHTML = ''; if (!piece) return;
            const rect = canvas.getBoundingClientRect(); const responsiveCellSize = Math.floor(rect.width / 24); slot.appendChild(createDOMGrid(piece, responsiveCellSize, false));
        }

        function createDOMGrid(piece, cellSize, isOverlay = false) {
            const miniGrid = document.createElement('div'); miniGrid.classList.add('mini-grid'); miniGrid.style.gridTemplateRows = `repeat(${piece.shape.length}, ${cellSize}px)`; miniGrid.style.gridTemplateColumns = `repeat(${piece.shape[0].length}, ${cellSize}px)`;
            piece.shape.forEach((row) => {
                row.forEach((val) => {
                    const miniCell = document.createElement('div'); miniCell.classList.add('mini-cell'); miniCell.style.width = `${cellSize}px`; miniCell.style.height = `${cellSize}px`;
                    if (isOverlay) miniCell.style.borderWidth = '3px'; if (val === 1) miniCell.classList.add(`color-${piece.color}`); else miniCell.classList.add('empty'); miniGrid.appendChild(miniCell);
                });
            });
            return miniGrid;
        }

        function handleDragStart(index, clientX, clientY) {
            if (activePieces[index] === null) return; selectedPieceIndex = index; isDragging = true; playSound('select');
            const slot = document.getElementById(`slot-${index}`); slot.style.opacity = '0.15'; slot.style.transform = 'scale(0.85)';
            const rect = canvas.getBoundingClientRect(); const overlayCellSize = rect.width / GRID_SIZE;
            dragOverlay.innerHTML = ''; dragOverlay.appendChild(createDOMGrid(activePieces[index], overlayCellSize, true)); dragOverlay.style.display = 'block'; mouseX = clientX; mouseY = clientY; moveDragOverlay(clientX, clientY);
        }

        function handleDragMove(clientX, clientY) { if (!isDragging) return; mouseX = clientX; mouseY = clientY; moveDragOverlay(clientX, clientY); }

        function handleDragEnd() {
            if (!isDragging) return; isDragging = false; dragOverlay.style.display = 'none';
            const slot = document.getElementById(`slot-${selectedPieceIndex}`); slot.style.opacity = '1'; slot.style.transform = 'scale(1)';
            const gridPos = getGridPosFromOverlay(mouseX, mouseY); const currentPiece = activePieces[selectedPieceIndex];
            if (gridPos && canPlacePiece(currentPiece.shape, gridPos.row, gridPos.col)) {
                placePiece(currentPiece, gridPos.row, gridPos.col); playSound('place'); activePieces[selectedPieceIndex] = null; slot.innerHTML = ''; selectedPieceIndex = null;
                checkAndClearLines(); if (activePieces.every(p => p === null)) spawnPieces();
                if (checkGameOver()) {
                    playSound('gameover');
                    document.getElementById('final-score').innerText = score;
                    document.getElementById('game-over').style.display = 'flex';
                    if(window.saveOnlineScore) window.saveOnlineScore(playerName, score);
                }
            } else { playSound('select'); selectedPieceIndex = null; }
        }

        function moveDragOverlay(x, y) { dragOverlay.style.left = `${x}px`; dragOverlay.style.top = `${y - DRAG_Y_OFFSET}px`; }

        for (let i = 0; i < 3; i++) {
            const slot = document.getElementById(`slot-${i}`); slot.addEventListener('mousedown', (e) => handleDragStart(i, e.clientX, e.clientY));
            slot.addEventListener('touchstart', (e) => { const touch = e.touches[0]; handleDragStart(i, touch.clientX, touch.clientY); }, { passive: true });
        }
        window.addEventListener('mousemove', (e) => handleDragMove(e.clientX, e.clientY)); window.addEventListener('touchmove', (e) => { if(isDragging) { const touch = e.touches[0]; handleDragMove(touch.clientX, touch.clientY); } }, { passive: false });
        window.addEventListener('mouseup', handleDragEnd); window.addEventListener('touchend', handleDragEnd); window.addEventListener('resize', () => { for (let i = 0; i < 3; i++) { if (activePieces[i] !== null) renderPieceInSlot(activePieces[i], i); } });

        function canPlacePiece(shape, startRow, startCol) {
            for (let r = 0; r < shape.length; r++) { for (let c = 0; c < shape[r].length; c++) { if (shape[r][c] === 1) { const gridR = startRow + r, gridC = startCol + c; if (gridR >= GRID_SIZE || gridC >= GRID_SIZE || gridR < 0 || gridC < 0) return false; if (gridData[gridR][gridC] !== 0) return false; } } } return true;
        }

        function placePiece(piece, startRow, startCol) {
            for (let r = 0; r < piece.shape.length; r++) { for (let c = 0; c < piece.shape[r].length; c++) { if (piece.shape[r][c] === 1) gridData[startRow + r][startCol + c] = piece.color; } }
            const blockCount = piece.shape.flat().filter(v => v === 1).length; triggerScoreAnimation(blockCount * 15);
        }

        function checkAndClearLines() {
            let rowsToClear = [], colsToClear = []; for (let r = 0; r < GRID_SIZE; r++) { if (gridData[r].every(val => val !== 0)) rowsToClear.push(r); }
            for (let c = 0; c < GRID_SIZE; c++) { let colFull = true; for (let r = 0; r < GRID_SIZE; r++) { if (gridData[r][c] === 0) { colFull = false; break; } } if (colFull) colsToClear.push(c); }
            let linesCleared = rowsToClear.length + colsToClear.length;
            if (linesCleared > 0) {
                comboCount += linesCleared; playSound('blast'); showScreenCombo(); 
                rowsToClear.forEach(r => { for(let c=0; c<GRID_SIZE; c++) createExplosion(getCellCoords(r, c).x, getCellCoords(r, c).y, TEXTURE_COLORS[gridData[r][c]].base); gridData[r] = Array(GRID_SIZE).fill(0); });
                colsToClear.forEach(c => { for (let r = 0; r < GRID_SIZE; r++) { if (gridData[r][c] !== 0) createExplosion(getCellCoords(r, c).x, getCellCoords(r, c).y, TEXTURE_COLORS[gridData[r][c]].base); gridData[r][c] = 0; } });
                const basePoints = linesCleared * 250 * linesCleared; const finalPoints = basePoints * comboCount; triggerScoreAnimation(finalPoints);
            } else { comboCount = 0; }
        }

        function showScreenCombo() {
            if (comboCount < 2) return; if (comboTimeoutId) clearTimeout(comboTimeoutId); screenCombo.innerText = `KOMBO X${comboCount}!`; screenCombo.classList.remove('pop', 'fade'); void screenCombo.offsetWidth; screenCombo.classList.add('pop'); comboTimeoutId = setTimeout(() => { screenCombo.classList.remove('pop'); screenCombo.classList.add('fade'); }, 3000);
        }

        function triggerScoreAnimation(amount) { score += amount; const scoreBox = document.getElementById('score-box'); document.getElementById('score').innerText = score; scoreBox.classList.add('pulse'); setTimeout(() => scoreBox.classList.remove('pulse'), 100); }

        function checkGameOver() {
            const remainingPieces = activePieces.filter(p => p !== null); if (remainingPieces.length === 0) return false;
            for (let piece of remainingPieces) { for (let r = 0; r < GRID_SIZE; r++) { for (let c = 0; c < GRID_SIZE; c++) { if (canPlacePiece(piece.shape, r, c)) return false; } } } return true; 
        }

        function restartGame() {
            gridData = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0)); score = 0; comboCount = 0; selectedPieceIndex = null; particles = [];
            document.getElementById('score').innerText = score; screenCombo.classList.remove('pop', 'fade'); document.getElementById('game-over').style.display = 'none';
            document.getElementById('start-menu').style.visibility = 'visible'; document.getElementById('start-menu').style.opacity = '1'; document.getElementById('game-container').style.opacity = '0';
        }
    </script>
</body>
</html>
